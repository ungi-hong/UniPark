name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 調査 PR は discount-research.json だけを追記してくるため、
      # ここで再生成してからテストすることで不正なデータをマージ前に検出する。
      # (既存エントリの座標は再利用されるので、ジオコーディングは新規分のみ)
      - name: Regenerate parking data
        run: node apps/web/scripts/build-parking-mock.mjs

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
