name: Data Sync

# discount-research.json が main に入ったら生成データを再生成してコミットする。
# このコミットは Vercel の Git 連携によって自動デプロイされる。

on:
  push:
    branches: [main]
    paths:
      - apps/web/data/discount-research.json
      - apps/web/scripts/build-parking-mock.mjs

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # 生成スクリプトは node 組み込みモジュールのみ使うため pnpm install 不要
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate parking data
        run: node apps/web/scripts/build-parking-mock.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): 駐車場データを discount-research.json から再生成"
            git push
          fi
